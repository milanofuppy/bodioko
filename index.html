function isU(p){if(p.length<6)return 0;let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;p.forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)});
 const w=x1-x0,h=y1-y0;if(w<70||h<60||w<h*.5||w>h*3)return 0;
 const a=p[0],b=p[p.length-1];if(a[1]>y0+h*.45||b[1]>y0+h*.45||Math.abs(a[0]-b[0])<w*.5)return 0;
 const lo=p.reduce((m,q)=>q[1]>m[1]?q:m);if(lo[0]<x0+w*.2||lo[0]>x1-w*.2)return 0;
 const bt=p.filter(q=>q[1]>y0+h*.8);if(!bt.length)return 0;const u=Math.min(...bt.map(q=>q[0])),v=Math.max(...bt.map(q=>q[0]));return v-u>=w*.15?1:0}
